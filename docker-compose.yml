version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgeiq
      POSTGRES_USER: forgeiq
      POSTGRES_PASSWORD: forgeiq_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed_config.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeiq"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://forgeiq:forgeiq_local@db:5432/forgeiq
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ZAUBA_API_KEY: ${ZAUBA_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-in-prod}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
